name: Build and verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: familye
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: familye_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U familye -d familye_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://familye:ci-test-password@localhost:5432/familye_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: node --check web/app.js
      - run: bash -n deploy/start.sh
      - run: docker build -t familye:ci .
      - uses: actions/upload-artifact@v4
        with:
          name: familye-build
          path: |
            dist/
            web/
            db/
            deploy/start.sh
            deploy/site.env
            package.json
            package-lock.json
            tab-site.json
