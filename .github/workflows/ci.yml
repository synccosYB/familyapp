name: Familye CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: familye_test
          POSTGRES_USER: familye
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U familye -d familye_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --check public/app.js
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://familye:ci-only-password@localhost:5432/familye_test
      - run: npm run build
      - run: git diff --check
      - run: docker build -t familye:ci .
