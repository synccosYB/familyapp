function heb(n){const o=['','א','ב','ג','ד','ה','ו','ז','ח','ט'],t=['','י','כ','ל','מ','נ','ס','ע','פ','צ'];let s='';if(n>=100){s+='ק';n-=100}if(n==15)return s+'טו';if(n==16)return s+'טז';s+=t[Math.floor(n/10)]+o[n%10];return s}

function doSim(){const s=$('ss').value;SIM.unshift({t:$('st').value,who:$('sw').value,s:s=='all'?(ME.s=='m'?'m':'f'):s,d:$('sd').value||'—',hd:'',pl:$('sp').value||'—',addr:$('sa').value.trim(),rsvp:{},yes:0,...(NEWINV||{})});NEWINV=null;cl();toast('✓ אינוויטעישן געשיקט צו '+(s=='all'?'אלע קאזינס':s=='f'?'טאטעס סייד':'מאמעס סייד'));go()}
function go(){const v=(location.hash||'#').slice(1)||'home';if(!ME){nav();$('m').innerHTML=V.login();return}nav(v);$('m').innerHTML=(V[v]||V.home)();window.scrollTo(0,0)}
$('md').onclick=e=>{if(e.target.id=='md')cl()};window.onhashchange=go;go();
</script></body></html>
